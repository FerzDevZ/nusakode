name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifikasi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Pasang komponen SDK
        # build-tools 28.0.3 wajib: satu-satunya sumber dx.jar (dexer perangkat) dan apksigner 0.8
        # yang masih berjalan di Android 7. Lihat ADR-017 dan ADR-018.
        run: |
          sdkmanager "platforms;android-34" "platforms;android-35" \
            "build-tools;28.0.3" "build-tools;35.0.0" "platform-tools"

      - name: Simpan cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: Tes unit + analisis statis
        run: ./gradlew --console=plain test detekt

      - name: Rakit aplikasi
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Susun aset toolchain ART
        run: bash scripts/toolchain/build-android-toolchain.sh

      - name: Buktikan pipeline Tier 0 (contoh + 3 template)
        run: |
          ./gradlew --console=plain :build:hostcli:installDist
          bash scripts/prove/build-hello.sh
          bash scripts/prove/build-templates.sh

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: kodenusa-debug
          path: app/build/outputs/apk/debug/app-debug.apk
